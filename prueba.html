<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estancia Parrillera - Menú Premium</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Antonio:wght@700&family=Open+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
        :root { --carbon: #0f0e0e; --pizarra: #181615; --oro-viejo: #c5a059; --blanco-hueso: #f4f1ea; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Open Sans', sans-serif; }
        body { background-color: var(--carbon); color: var(--blanco-hueso); overflow-x: hidden; }
        
        /* --- ESTILOS ESENCIALES --- */
        #loader { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #000; z-index: 9999; display: flex; justify-content: center; align-items: center; transition: opacity 0.5s ease; }
        .navbar { position: fixed; top: 0; width: 100%; height: 80px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-between; align-items: center; padding: 0 1.5rem; z-index: 1000; }
        .page-section { display: none; padding-top: 80px; min-height: 100vh; }
        .page-section.active-section { display: block; }
        .hero-video-container { position: relative; height: 90vh; width: 100%; overflow: hidden; display: flex; align-items: center; justify-content: center; text-align: center; }
        .bg-video { position: absolute; top: 50%; left: 50%; width: 100%; height: 100%; object-fit: cover; transform: translate(-50%, -50%); opacity: 0; transition: opacity 1.2s; }
        .bg-video.visible { opacity: 0.45; }
        
        /* Menú Lateral y Tabs (Mismos que tenías) */
        .sidebar { position: fixed; top: 0; right: -100%; width: 100%; max-width: 360px; height: 100vh; background: #000; z-index: 2000; transition: 0.4s; padding: 2rem; }
        .sidebar.active { right: 0; }
        .tabs-contenedor { background: var(--pizarra); position: sticky; top: 80px; z-index: 900; display: flex; overflow-x: auto; padding: 1rem; gap: 1rem; }
        .tab-boton { background: none; border: none; color: #a3a3a3; text-transform: uppercase; font-weight: 700; cursor: pointer; padding: 0.5rem; }
        .tab-boton.active { color: var(--oro-viejo); border-bottom: 2px solid var(--oro-viejo); }
        .categoria-contenido { display: none; max-width: 650px; margin: 2rem auto; padding: 0 1rem; }
        .categoria-contenido.active { display: block; }
        .menu-item { background: var(--pizarra); padding: 1.2rem; border-radius: 6px; margin-bottom: 1rem; border-left: 3px solid var(--oro-viejo); }
        .item-encabezado { display: flex; justify-content: space-between; font-weight: 700; }
        .item-precio { color: var(--oro-viejo); }
        .subcat-titulo { color: var(--oro-viejo); font-family: 'Antonio'; font-size: 1.4rem; margin: 2rem 0 1rem; border-bottom: 1px dashed #c5a059; }
    </style>
</head>
<body>

    <div id="loader"><img src="LogoEstancia.png" alt="Cargando..." style="width:160px;"></div>

    <nav class="navbar">
        <div class="nav-logo" onclick="navegarA('inicio')"><img src="LogoEstancia.png" style="height:50px; cursor:pointer;"></div>
        <div class="nav-actions">
            <button class="btn-reserva" onclick="abrirModalReservas()">Reservar</button>
            <button class="menu-toggle" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        </div>
    </nav>

    <div class="sidebar" id="sidebarMenu">
        <button onclick="toggleSidebar()">&times;</button>
        <ul class="sidebar-links">
            <li><a href="#" onclick="navegarA('inicio')">✦ Inicio</a></li>
            <li><button class="submenu-trigger" onclick="toggleSubmenu()">✦ Nuestra Carta</button>
                <ul id="cartaSubmenu" style="max-height:0; overflow:hidden; transition:0.3s;">
                    <li><a href="#" onclick="navegarACategoria('parrillas')">» Parrillas</a></li>
                    <li><a href="#" onclick="navegarACategoria('al-carta')">» A la Carta</a></li>
                    <li><a href="#" onclick="navegarACategoria('guarniciones')">» Guarniciones</a></li>
                    <li><a href="#" onclick="navegarACategoria('bebidas')">» Bebidas</a></li>
                </ul>
            </li>
        </ul>
    </div>

    <!-- SECCIONES -->
    <section id="inicio" class="page-section active-section">
        <div class="hero-video-container">
            <video id="vid0" class="bg-video visible" autoplay loop muted playsinline><source src="PARRILLA MIXTA2.mp4" type="video/mp4"></video>
            <div class="hero-content"><h1>Saborea las Mejores Parrillas</h1><p>Tradición y sabor en Virú</p></div>
        </div>
    </section>

    <section id="carta" class="page-section">
        <div class="tabs-contenedor">
            <button class="tab-boton active" id="btn-parrillas" onclick="cambiarTab('parrillas')">Parrillas</button>
            <button class="tab-boton" id="btn-al-carta" onclick="cambiarTab('al-carta')">Platos a la Carta</button>
            <button class="tab-boton" id="btn-guarniciones" onclick="cambiarTab('guarniciones')">Guarniciones</button>
            <button class="tab-boton" id="btn-bebidas" onclick="cambiarTab('bebidas')">Bebidas</button>
        </div>
        <div id="parrillas" class="categoria-contenido active">
            <div class="subcat-titulo">Parrillas Personales</div>
            <div class="menu-item"><div class="item-encabezado"><span>Lomo Fino</span><span class="item-precio">S/. 55.00</span></div></div>
        </div>
        <div id="al-carta" class="categoria-contenido">...</div>
        <div id="guarniciones" class="categoria-contenido">...</div>
        <div id="bebidas" class="categoria-contenido">...</div>
    </section>

    <script>
        function toggleSidebar() { document.getElementById('sidebarMenu').classList.toggle('active'); }
        function toggleSubmenu() { 
            const s = document.getElementById('cartaSubmenu'); 
            s.style.maxHeight = s.style.maxHeight === '0px' ? s.scrollHeight + 'px' : '0px'; 
        }
        function navegarA(id) {
            document.querySelectorAll('.page-section').forEach(s => s.classList.remove('active-section'));
            document.getElementById(id).classList.add('active-section');
            document.getElementById('sidebarMenu').classList.remove('active');
        }
        function navegarACategoria(tabId) {
            navegarA('carta');
            cambiarTab(tabId);
        }
        function cambiarTab(tabId) {
            document.querySelectorAll('.categoria-contenido').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-boton').forEach(b => b.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.add('active');
        }
    </script>
</body>
</html>
